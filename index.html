<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ma collection — Bibliothèque BD d'Arnaud</title>
<meta name="description" content="La collection de BD d'Arnaud : séries, albums possédés, lus et manquants.">
<script>
  // Thème appliqué avant l'affichage pour éviter un flash de couleurs.
  (function () {
    var t = null;
    try { t = localStorage.getItem('bd-theme'); } catch (e) {}
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
  })();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bangers&family=Comic+Neue:wght@700&display=swap">
<link rel="stylesheet" href="css/style.css?v=14">
<script src="js/app.js?v=14" defer></script>
</head>
<body data-page="collection">

<header class="site-header">
  <div class="container">
    <div class="header-top">
      <div class="brand">
        <div>
          <h1><a href="index.html">Bibliothèque BD d'Arnaud</a></h1>
          <p id="stats-entete">Chargement…</p>
        </div>
      </div>
      <button type="button" class="theme-toggle" aria-label="Changer de thème">
        <svg class="icon-moon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icon-sun" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
    <nav class="main-nav" aria-label="Navigation principale">
      <a href="index.html" aria-current="page">Collection</a>
      <a href="stats.html">Tableau de bord</a>
      <a href="bilan.html">Bilan</a>
      <a href="reco.html">Recommandations</a>
    </nav>
  </div>
</header>

<main class="container">
  <div class="search">
    <label for="recherche">Rechercher une série</label>
    <div class="search-field">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="recherche" type="search" placeholder="Titre ou auteur" autocomplete="off" spellcheck="false">
    </div>
  </div>

  <div class="chips" role="group" aria-label="Filtrer les séries">
    <button type="button" data-filtre="tout" aria-pressed="true">Tout</button>
    <button type="button" data-filtre="possedees" aria-pressed="false">Possédées</button>
    <button type="button" data-filtre="lues" aria-pressed="false">Lues</button>
    <button type="button" data-filtre="alire" aria-pressed="false">À lire</button>
    <button type="button" data-filtre="incompletes" aria-pressed="false">Incomplètes</button>
    <button type="button" data-filtre="coups-de-coeur" aria-pressed="false">Coups de cœur</button>
  </div>

  <div class="reglages">
    <label class="reglage">
      <span>Regard</span>
      <select id="f-regard">
        <option value="toutes">Toutes les séries</option>
        <option value="gouts">Mes goûts</option>
        <option value="classique">Classiques</option>
        <option value="jeunesse">Jeunesse</option>
        <option value="hors-gout">Hors goût</option>
        <option value="non-suivi">Non suivi</option>
      </select>
    </label>
    <label class="reglage">
      <span>Genre</span>
      <select id="f-genre">
        <option value="">Tous les genres</option>
      </select>
    </label>
    <label class="reglage">
      <span>Trier par</span>
      <select id="f-tri">
        <option value="titre">Titre (A → Z)</option>
        <option value="note">Note</option>
        <option value="tomes">Nombre de tomes</option>
        <option value="manquants">Tomes manquants</option>
        <option value="ajout">Ajout récent</option>
      </select>
    </label>
    <button type="button" class="toggle" id="f-suivies" aria-pressed="false">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>
      Suivies seulement
    </button>
    <button type="button" class="lien-reinit" id="reinitialiser" hidden>Tout réinitialiser</button>
    <div class="vues" role="group" aria-label="Affichage">
      <button type="button" data-vue="cartes" aria-pressed="true" title="Cartes détaillées">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="9" rx="1"/><path d="M3 16h7M3 20h5M14 16h7M14 20h5"/></svg>
        Cartes
      </button>
      <button type="button" data-vue="couvertures" aria-pressed="false" title="Mur de couvertures">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="5" height="7" rx="1"/><rect x="9.5" y="3" width="5" height="7" rx="1"/><rect x="16" y="3" width="5" height="7" rx="1"/><rect x="3" y="14" width="5" height="7" rx="1"/><rect x="9.5" y="14" width="5" height="7" rx="1"/><rect x="16" y="14" width="5" height="7" rx="1"/></svg>
        Couvertures
      </button>
    </div>
  </div>

  <div class="legend" aria-label="Légende des couleurs">
    <span><span class="swatch swatch-own" aria-hidden="true"></span>Possédé</span>
    <span><span class="swatch swatch-read" aria-hidden="true"></span>Lu</span>
    <span><span class="swatch swatch-toread" aria-hidden="true"></span>À lire</span>
    <span><span class="swatch swatch-lnp" aria-hidden="true"></span>Lu, non possédé</span>
    <span><span class="swatch swatch-miss" aria-hidden="true"></span>Manquant</span>
  </div>

  <p class="count" id="compteur" aria-live="polite"></p>
  <ul class="series-grid" id="liste-series"></ul>

  <div class="message" id="aucun-resultat" role="status" hidden>
    <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="4" height="16" rx="1"/><rect x="9" y="6" width="4" height="14" rx="1"/><circle cx="17.5" cy="13.5" r="3.5"/><path d="M20 16l2 2"/></svg>
    <h2>Aucune série trouvée</h2>
    <p id="aucun-resultat-texte"></p>
    <p>Vérifiez l’orthographe ou essayez le nom d’un auteur.</p>
    <button type="button" class="btn-primary" id="effacer">Effacer la recherche</button>
  </div>
</main>

<footer class="site-footer">Consultation seule</footer>

</body>
</html>
